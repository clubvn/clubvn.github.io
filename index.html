
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111B2B">
  <meta name="description" content="VN SHOP — Official VN Store">

  <title>VN SHOP®</title>

  <link
    rel="icon"
    type="image/png"
    href="/assets/logo/vn-logo-black-transparent.png"
  >
  <link
    rel="apple-touch-icon"
    href="/assets/logo/vn-logo-black-transparent.png"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #111B2B;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      padding: 30px 24px;
    }

    .logo {
      display: block;
      width: clamp(110px, 17vw, 190px);
      height: auto;
      filter: brightness(0) invert(1);
      object-fit: contain;
    }

    main {
      position: relative;
      display: grid;
      min-height: calc(100svh - 140px);
      place-items: center;
      isolation: isolate;
    }

    .watermark {
      position: absolute;
      z-index: -1;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      pointer-events: none;
    }

    .watermark img {
      width: min(150vw, 1800px);
      max-width: none;
      height: auto;
      opacity: 0.12;
      filter: none;
      user-select: none;
    }

    h1 {
      margin: 0;
      font-family: Arial, "Helvetica Neue", sans-serif;
      font-size: clamp(32px, 5.5vw, 68px);
      font-weight: 800;
      letter-spacing: 0.12em;
      text-indent: 0.12em;
      text-transform: uppercase;
    }

    h1 a {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      header {
        padding-top: 28px;
      }

      main {
        min-height: calc(100svh - 120px);
      }

      .watermark img {
        width: 190vw;
      }
    }
  </style>
</head>

<body>
  <header>
    <img
      class="logo"
      src="/assets/logo/vn-logo-black-transparent.png"
      alt="VN"
    >
  </header>

  <main>
    <div class="watermark" aria-hidden="true">
      <img
        src="/assets/logo/vn-logo-black-transparent.png"
        alt=""
      >
    </div>

    <h1>
      <a href="/shop.html">VN SHOP®</a>
    </h1>
  </main>

  <!-- Invisible background music: no Spotify embed -->
  <audio id="siteMusic" autoplay loop preload="auto">
    <source
      src="/assets/mp3/SpotiDownloader.com%20-%20I%20Won%27t%20Last%20A%20Day%20Without%20You%20-%20Paul%20Williams.mp3"
      type="audio/mpeg"
    >
  </audio>

  <script>
    const music = document.getElementById("siteMusic");

    music.volume = 0.35;

    function startMusic() {
      music.play().catch(() => {
        // The browser may require user interaction before playing audio.
      });
    }

    startMusic();

    document.addEventListener("click", startMusic, { once: true });
    document.addEventListener("touchstart", startMusic, { once: true });
  </script>
</body>
</html>
