
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07162E">
  <meta name="description" content="VN SHOP — Official VN Store">
  <title>VN SHOP®</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #07162E;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      padding: 30px 24px;
    }

    .logo {
      display: block;
      width: clamp(110px, 17vw, 190px);
      height: auto;
      filter: brightness(0) invert(1);
      object-fit: contain;
    }

    main {
      position: relative;
      display: grid;
      min-height: calc(100svh - 140px);
      place-items: center;
      isolation: isolate;
    }

    .watermark {
      position: absolute;
      z-index: -1;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      pointer-events: none;
    }

    .watermark img {
      width: min(105vw, 1250px);
      max-width: none;
      height: auto;
      opacity: 0.055;
      filter: brightness(0) invert(1);
      user-select: none;
    }

    h1 {
      margin: 0;
      font-family: "Arial", "Helvetica Neue", sans-serif;
      font-size: clamp(32px, 5.5vw, 68px);
      font-weight: 800;
      letter-spacing: 0.12em;
      text-indent: 0.12em;
      text-transform: uppercase;
    }

    @media (max-width: 600px) {
      header {
        padding-top: 28px;
      }

      main {
        min-height: calc(100svh - 120px);
      }

      .watermark img {
        width: 145vw;
      }
    }
  </style>
</head>

<body>
  <header>
    <img
      class="logo"
      src="/assets/logo/vn-logo-black-transparent.png"
      alt="VN"
    >
  </header>

  <main>
    <div class="watermark" aria-hidden="true">
      <img src="/assets/logo/vn-logo-black-transparent.png" alt="">
    </div>

    <h1>VN SHOP®</h1>
  </main>
</body>
</html>
