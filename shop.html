
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111B2B">
  <meta name="description" content="VN SHOP — Official VN Store">

  <title>VN SHOP®</title>

  <link rel="icon" type="image/png" href="/assets/logo/vn-logo-black-transparent.png">
  <link rel="apple-touch-icon" href="/assets/logo/vn-logo-black-transparent.png">

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --background: #111B2B;
      --white: #fff;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .site-header {
      position: relative;
      z-index: 3;
      padding: 24px 4vw 0;
    }

    /* TOP ROW */

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }

    .brand img {
      display: block;
      width: clamp(105px, 13vw, 155px);
      height: auto;
      filter: brightness(0) invert(1);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .icon-button {
      position: relative;
      display: inline-grid;
      place-items: center;
      width: 38px;
      height: 38px;
      padding: 5px;
      border: 0;
      background: transparent;
      color: #fff;
    }

    .icon-button svg {
      display: block;
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .cart-count {
      position: absolute;
      top: -2px;
      right: -4px;
      display: none;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border-radius: 50px;
      background: #fff;
      color: #111B2B;
      font-size: 10px;
      line-height: 17px;
      text-align: center;
    }

    /* SECOND ROW */

    .navigation-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-top: 22px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.17);
    }

    .category-wrap {
      position: relative;
      min-width: 0;
    }

    .category-button {
      display: flex;
      align-items: center;
      gap: 20px;
      min-height: 42px;
      padding: 0 17px;
      border: 0;
      border-radius: 2px;
      background: #fff;
      color: #111B2B;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .category-button svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
    }

    .category-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      z-index: 5;
      display: none;
      width: min(280px, 84vw);
      max-height: 65vh;
      overflow-y: auto;
      padding: 8px;
      background: #fff;
      color: #111B2B;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
    }

    .category-menu.open {
      display: block;
    }

    .category-option {
      display: block;
      width: 100%;
      padding: 12px 13px;
      border: 0;
      background: transparent;
      color: #111B2B;
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    .category-option:hover,
    .category-option.active {
      background: #edf0f4;
    }

    .navigation-tools {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-box {
      display: none;
      align-items: center;
      width: min(250px, 40vw);
      border-bottom: 1px solid rgba(255, 255, 255, 0.7);
    }

    .search-box.open {
      display: flex;
    }

    .search-box input {
      width: 100%;
      min-width: 0;
      padding: 10px 2px;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font-size: 12px;
    }

    .search-box input::placeholder {
      color: rgba(255, 255, 255, 0.65);
    }

    /* BACKGROUND WATERMARK */

    .watermark {
      position: fixed;
      z-index: 0;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      pointer-events: none;
    }

    .watermark img {
      width: min(150vw, 1800px);
      max-width: none;
      height: auto;
      opacity: 0.12;
      user-select: none;
    }

    /* SHOP CONTENT */

    .shop-content {
      position: relative;
      z-index: 1;
      min-height: 65vh;
    }

    /* CART DRAWER */

    .drawer-overlay {
      position: fixed;
      z-index: 9;
      inset: 0;
      background: rgba(0, 0, 0, 0.48);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .drawer-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .cart-drawer {
      position: fixed;
      z-index: 10;
      top: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      width: min(440px, 100%);
      height: 100vh;
      height: 100dvh;
      padding: 28px;
      background: #fff;
      color: #111B2B;
      transform: translateX(100%);
      transition: transform 0.3s ease;
    }

    .cart-drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 22px;
      border-bottom: 1px solid #e5e5e5;
    }

    .drawer-title {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.14em;
    }

    .close-button {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 0;
      background: transparent;
      color: #111B2B;
    }

    .close-button svg {
      width: 23px;
      height: 23px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
    }

    .cart-empty {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 0 55px;
      text-align: center;
    }

    .cart-empty h2 {
      margin: 0 0 12px;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .cart-empty p {
      margin: 0 0 27px;
      color: #777;
      font-size: 13px;
    }

    .continue-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 28px;
      border: 1px solid #111B2B;
      background: #111B2B;
      color: #fff;
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .continue-button:hover {
      background: #fff;
      color: #111B2B;
    }

    body.drawer-open {
      overflow: hidden;
    }

    @media (max-width: 600px) {
      .site-header {
        padding: 20px 18px 0;
      }

      .brand img {
        width: 105px;
      }

      .header-actions {
        gap: 10px;
      }

      .navigation-row {
        gap: 10px;
        margin-top: 17px;
        padding-bottom: 16px;
      }

      .category-button {
        gap: 10px;
        min-height: 39px;
        padding: 0 11px;
        font-size: 10px;
      }

      .navigation-tools {
        gap: 2px;
      }

      .icon-button {
        width: 34px;
        height: 34px;
      }

      .icon-button svg {
        width: 22px;
        height: 22px;
      }

      .search-box {
        width: min(145px, 36vw);
      }

      .watermark img {
        width: 190vw;
      }

      .cart-drawer {
        padding: 23px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="watermark" aria-hidden="true">
    <img src="/assets/logo/vn-logo-black-transparent.png" alt="">
  </div>

  <header class="site-header">
    <div class="top-row">
      <a class="brand" href="/" aria-label="VN SHOP home">
        <img
          src="/assets/logo/vn-logo-black-transparent.png"
          alt="VN"
        >
      </a>

      <div class="header-actions">
        <button
          class="icon-button"
          type="button"
          aria-label="Profile"
          title="Profile"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4.5 21a7.5 7.5 0 0 1 15 0"></path>
          </svg>
        </button>

        <button
          class="icon-button"
          id="cartButton"
          type="button"
          aria-label="Open shopping cart"
          aria-controls="cartDrawer"
          aria-expanded="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 4h2l2.2 11.1a2 2 0 0 0 2 1.6h8.9a2 2 0 0 0 2-1.6L22 8H6"></path>
            <circle cx="10" cy="20" r="1"></circle>
            <circle cx="18" cy="20" r="1"></circle>
          </svg>
          <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </div>

    <nav class="navigation-row" aria-label="Shop navigation">
      <div class="category-wrap">
        <button
          class="category-button"
          id="categoryButton"
          type="button"
          aria-expanded="false"
          aria-controls="categoryMenu"
        >
          <span id="selectedCategory">ALL</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 9 6 6 6-6"></path>
          </svg>
        </button>

        <div class="category-menu" id="categoryMenu">
          <button class="category-option active" type="button">ALL</button>
          <button class="category-option" type="button">CD</button>
          <button class="category-option" type="button">VINYL</button>
          <button class="category-option" type="button">XTRAS</button>
          <button class="category-option" type="button">TOPS</button>
          <button class="category-option" type="button">PANTS</button>
          <button class="category-option" type="button">OUTERWEAR</button>
          <button class="category-option" type="button">CAPS</button>
          <button class="category-option" type="button">CHAINS</button>
          <button class="category-option" type="button">BRACELETS</button>
          <button class="category-option" type="button">DECO</button>
          <button class="category-option" type="button">GIGS</button>
          <button class="category-option" type="button">DIGIART</button>
          <button class="category-option" type="button">ALL MERCH</button>
        </div>
      </div>

      <div class="navigation-tools">
        <form class="search-box" id="searchBox" role="search">
          <input
            id="searchInput"
            type="search"
            placeholder="Search..."
            aria-label="Search products"
          >
        </form>

        <button
          class="icon-button"
          id="searchButton"
          type="button"
          aria-label="Open search"
          aria-expanded="false"
          aria-controls="searchBox"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8"></circle>
            <path d="m16 16 5 5"></path>
          </svg>
        </button>
      </div>
    </nav>
  </header>

  <main class="shop-content">
    <!-- Products can be added here later. -->
  </main>

  <div class="drawer-overlay" id="drawerOverlay"></div>

  <aside
    class="cart-drawer"
    id="cartDrawer"
    role="dialog"
    aria-modal="true"
    aria-labelledby="cartTitle"
    aria-hidden="true"
  >
    <div class="drawer-header">
      <h2 class="drawer-title" id="cartTitle">YOUR CART</h2>

      <button
        class="close-button"
        id="closeCart"
        type="button"
        aria-label="Close shopping cart"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18"></path>
        </svg>
      </button>
    </div>

    <div class="cart-empty">
      <h2>Your cart is empty</h2>
      <p>Time to fill up</p>
      <a class="continue-button" id="continueShopping" href="#">
        CONTINUE SHOPPING
      </a>
    </div>
  </aside>

  <script>
    const cartButton = document.getElementById("cartButton");
    const cartDrawer = document.getElementById("cartDrawer");
    const closeCart = document.getElementById("closeCart");
    const drawerOverlay = document.getElementById("drawerOverlay");
    const continueShopping = document.getElementById("continueShopping");

    const categoryButton = document.getElementById("categoryButton");
    const categoryMenu = document.getElementById("categoryMenu");
    const selectedCategory = document.getElementById("selectedCategory");
    const categoryOptions = document.querySelectorAll(".category-option");

    const searchButton = document.getElementById("searchButton");
    const searchBox = document.getElementById("searchBox");
    const searchInput = document.getElementById("searchInput");

    function openCart() {
      cartDrawer.classList.add("open");
      drawerOverlay.classList.add("open");
      document.body.classList.add("drawer-open");
      cartDrawer.setAttribute("aria-hidden", "false");
      cartButton.setAttribute("aria-expanded", "true");
      closeCart.focus();
    }

    function closeCartPanel() {
      cartDrawer.classList.remove("open");
      drawerOverlay.classList.remove("open");
      document.body.classList.remove("drawer-open");
      cartDrawer.setAttribute("aria-hidden", "true");
      cartButton.setAttribute("aria-expanded", "false");
      cartButton.focus();
    }

    cartButton.addEventListener("click", openCart);
    closeCart.addEventListener("click", closeCartPanel);
    drawerOverlay.addEventListener("click", closeCartPanel);

    continueShopping.addEventListener("click", function (event) {
      event.preventDefault();
      closeCartPanel();
    });

    categoryButton.addEventListener("click", function () {
      const isOpen = categoryMenu.classList.toggle("open");
      categoryButton.setAttribute("aria-expanded", String(isOpen));
    });

    categoryOptions.forEach(function (option) {
      option.addEventListener("click", function () {
        categoryOptions.forEach(function (item) {
          item.classList.remove("active");
        });

        option.classList.add("active");
        selectedCategory.textContent = option.textContent;
        categoryMenu.classList.remove("open");
        categoryButton.setAttribute("aria-expanded", "false");
      });
    });

    searchButton.addEventListener("click", function () {
      const isOpen = searchBox.classList.toggle("open");
      searchButton.setAttribute("aria-expanded", String(isOpen));

      if (isOpen) {
        searchInput.focus();
      } else {
        searchInput.value = "";
      }
    });

    document.addEventListener("click", function (event) {
      if (!event.target.closest(".category-wrap")) {
        categoryMenu.classList.remove("open");
        categoryButton.setAttribute("aria-expanded", "false");
      }
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        if (cartDrawer.classList.contains("open")) {
          closeCartPanel();
        }

        categoryMenu.classList.remove("open");
        categoryButton.setAttribute("aria-expanded", "false");

        if (searchBox.classList.contains("open")) {
          searchBox.classList.remove("open");
          searchButton.setAttribute("aria-expanded", "false");
          searchInput.value = "";
        }
      }
    });
  </script>
</body>
</html>
